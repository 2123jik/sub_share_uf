name: Batch Sync Latest Subs

on:
  workflow_dispatch: # 手动触发

jobs:
  batch_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 腾出磁盘空间
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true

      # 2. 检出当前仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 3. 安装 SVN
      - name: Install SVN
        run: sudo apt-get update -qq && sudo apt-get install -y subversion

      # 4. 最稳分批：按年份子目录逐个搬运最新状态
      # 4. 最稳分批：按年份子目录逐个搬运最新状态
      - name: Sync by Subdirectories
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BASE_URL="https://svn.acgdev.com:505/svn/sub_share/trunk/subs_list/animation"

          # 直接用回你最初验证成功的数组传参，杜绝任何字符被误传
          SVN_OPTS=(
            "--username" "test"
            "--password" ""
            "--no-auth-cache"
            "--non-interactive"
            "--trust-server-cert-failures=unknown-ca,cn-mismatch,expired,not-yet-valid,other"
          )

          # 1. 获取年份列表
          YEARS=$(svn list "${SVN_OPTS[@]}" "$BASE_URL")

          # 2. 逐个年份搬运
          for YR in $YEARS; do
            YR="${YR%/}" # 去除 SVN 返回的末尾斜杠
            TARGET_DIR="subs_list/animation/$YR"

            # 断点检查：本地如果已经有了，直接跳过
            if [ -d "$TARGET_DIR" ]; then
              echo ">>> 跳过已存在的: $YR"
              continue
            fi

            echo "=========================================="
            echo ">>> 正在搬运: $YR"
            echo "=========================================="

            mkdir -p "$TARGET_DIR"
            svn export --force "${SVN_OPTS[@]}" "$BASE_URL/$YR" "$TARGET_DIR"

            # 立即提交并推送到 GitHub
            # 立即提交并推送到 GitHub
            git add "$TARGET_DIR"
            if ! git diff --staged --quiet; then
              git commit -m "sync: animation/$YR"
              # 先把远程新提交（比如你刚改的 yml/脚本）拉下来变基合入，再推送
              git pull --rebase origin main
              git push origin HEAD:main
              echo ">>> 推送完成: $YR"
            fi
          done

          echo "全部年份搬运完成！"
          echo "所有分类全部搬运完成！"
